<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help Route — Admin Dashboard</title>
  <style>
    :root {
      --bg: #c5edb6;
      --card-border: #CAE8BD;
      --btn: #B0DB9C;
      --btn-hover: #9cc78a;
      --text: #333333;
      --white: #ffffff;
      --shadow: rgba(31, 41, 55, 0.08);
      --light-gray: rgba(51, 51, 51, 0.6);
    }
    
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    header {
      background: var(--white);
      border-bottom: 2px solid var(--card-border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px var(--shadow);
    }
    
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .brand {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
    }
    
    .subtitle-header {
      font-size: 12px;
      color: var(--light-gray);
    }
    
    .logout-btn {
      background: var(--btn);
      border: 0;
      color: var(--white);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s ease, transform 0.08s ease;
    }
    
    .logout-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }
    
    main {
      flex: 1;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    
    .card {
      background: var(--white);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 20px var(--shadow);
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 12px 0;
      color: var(--text);
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--btn);
      margin: 8px 0 0 0;
    }
    
    .stat-label {
      font-size: 13px;
      color: var(--light-gray);
      margin: 4px 0 0 0;
    }
    
    .dashboard-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }
    
    .refresh-btn {
      background: var(--btn);
      border: 0;
      color: var(--white);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.12s ease, transform 0.08s ease;
    }
    
    .refresh-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }
    
    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .donation-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .donation-item {
      background: #fbfffb;
      border: 1px solid #dfe7d8;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    
    .donation-info {
      flex: 1;
    }
    
    .donation-item-text {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    
    .donation-location {
      font-size: 12px;
      color: var(--light-gray);
      margin: 6px 0 0 0;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--light-gray);
      font-size: 14px;
    }
    
    .error {
      background: #ffe0e0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    
    footer {
      background: var(--white);
      border-top: 2px solid var(--card-border);
      text-align: center;
      padding: 16px 24px;
      font-size: 12px;
      color: var(--light-gray);
      margin-top: auto;
    }
    
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
      
      .header-left {
        width: 100%;
      }
      
      .logout-btn {
        width: 100%;
      }
      
      main {
        padding: 16px;
      }
      
      .container {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .donation-item {
        flex-direction: column;
      }
      
      .section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .refresh-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 class="brand">Help Route</h1>
      <div class="subtitle-header">Admin Dashboard</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <main>
    <div class="dashboard-section">
      <!-- Statistics Container -->
      <div>
        <div class="section-header">
          <h2 class="section-title">Statistics</h2>
          <button class="refresh-btn" id="refreshBtn">Refresh Stats</button>
        </div>
        <div class="container" id="statsContainer">
          <div class="loading">Loading statistics...</div>
        </div>
      </div>

      <!-- Donations Overview -->
      <div>
        <h2 class="section-title">Donation Overview</h2>
        <div class="card" id="donationCard">
          <div class="loading">Loading donations...</div>
        </div>
      </div>
    </div>
  </main>

  <footer>Help Route • Admin Panel</footer>

  <script>
    (function() {
      const API_BASE = 'http://localhost:8000';
      const statsContainer = document.getElementById('statsContainer');
      const donationCard = document.getElementById('donationCard');
      const refreshBtn = document.getElementById('refreshBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      // Fetch and display statistics
      async function loadStats() {
        refreshBtn.disabled = true;
        statsContainer.innerHTML = '<div class="loading">Loading statistics...</div>';
        
        try {
          const response = await fetch(`${API_BASE}/stats`);
          if (!response.ok) throw new Error('Failed to fetch stats');
          
          const data = await response.json();
          statsContainer.innerHTML = `
            <div class="card">
              <div class="card-title">Total Donations</div>
              <div class="stat-value">${data.total_donations || 0}</div>
              <div class="stat-label">Items donated</div>
            </div>
            <div class="card">
              <div class="card-title">Active Volunteers</div>
              <div class="stat-value">${data.volunteers || 0}</div>
              <div class="stat-label">Currently active</div>
            </div>
          `;
        } catch (error) {
          statsContainer.innerHTML = `<div class="error">Error loading stats: ${error.message}</div>`;
        } finally {
          refreshBtn.disabled = false;
        }
      }

      // Fetch and display donations
      async function loadDonations() {
        donationCard.innerHTML = '<div class="loading">Loading donations...</div>';
        
        try {
          const response = await fetch(`${API_BASE}/donations`);
          if (!response.ok) throw new Error('Failed to fetch donations');
          
          const donations = await response.json();
          
          if (!Array.isArray(donations) || donations.length === 0) {
            donationCard.innerHTML = '<div class="loading">No donations found.</div>';
            return;
          }
          
          let html = '<div class="donation-list">';
          donations.forEach(donation => {
            html += `
              <div class="donation-item">
                <div class="donation-info">
                  <div class="donation-item-text">${donation.item || 'Unknown Item'}</div>
                  <div class="donation-location">📍 ${donation.location || 'Unknown Location'}</div>
                </div>
              </div>
            `;
          });
          html += '</div>';
          donationCard.innerHTML = html;
        } catch (error) {
          donationCard.innerHTML = `<div class="error">Error loading donations: ${error.message}</div>`;
        }
      }

      // Event listeners
      refreshBtn.addEventListener('click', loadStats);
      logoutBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      // Initial load
      loadStats();
      loadDonations();
    })();
  </script>
</body>
</html>
