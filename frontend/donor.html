<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HelpRoute — Donor Dashboard</title>

<style>
:root{
--bg:#E1F0DA;
--card:#ffffff;
--border:#d2ee91;
--btn:#427A43;
--text:#333;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui;
background:var(--bg);
padding:30px;
}

.top-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title{
font-size:26px;
font-weight:800;
color:#2f4f2f;
border-bottom:3px solid #427A43;
display:inline-block;
padding-bottom:4px;
}

.subtitle{
font-size:13px;
color:#555;
margin-top:4px;
}

.logout{
background:#9cc589;
border:none;
padding:8px 18px;
border-radius:20px;
font-weight:600;
cursor:pointer;
}

.welcome{
background:white;
padding:30px;
border-radius:16px;
text-align:center;
margin-bottom:30px;
box-shadow:0 6px 15px rgba(0,0,0,.08);
}

.impact{
display:flex;
gap:20px;
margin-bottom:30px;
}

.impact-card{
flex:1;
background:white;
padding:20px;
border-radius:14px;
text-align:center;
box-shadow:0 6px 15px rgba(0,0,0,.08);
}

.impact-card h2{
margin:0;
color:#427A43;
font-size:28px;
}

.impact-card p{
margin:6px 0 0;
font-size:13px;
color:#555;
}

.recent{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 6px 15px rgba(0,0,0,.08);
}

.recent h3{
margin-top:0;
}

.recent-item{
padding:10px 0;
border-bottom:1px solid #eee;
font-size:14px;
}

.recent-item:last-child{border-bottom:none}

</style>
</head>

<body>

<div class="top-header">
<div>
<div class="title">HelpRoute</div>
<div class="subtitle">Donor Dashboard</div>
</div>

<button class="logout" onclick="location.href='index.html'">Logout</button>
</div>

<div class="welcome">
<h2>Welcome, Donor! 🎁</h2>
<p>Your contributions make a real difference in our community.</p>
</div>

<div class="impact">

<div class="impact-card">
<h2>12</h2>
<p>Total Donations</p>
</div>

<div class="impact-card">
<h2>36</h2>
<p>People Helped</p>
</div>

<div class="impact-card">
<h2>5</h2>
<p>Active Volunteers</p>
</div>

</div>

<div class="recent">
<h3>Recent Donations</h3>

<div class="recent-item">🍞 Food – Nagpur</div>
<div class="recent-item">👕 Clothes – Wardha</div>
<div class="recent-item">📚 Books – Amravati</div>

</div>

</body>
</html>
