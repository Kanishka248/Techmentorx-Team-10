<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help Route — Volunteer Dashboard</title>
  <style>
    :root {
      --bg: #c5edb6;
      --card-border: #CAE8BD;
      --btn: #B0DB9C;
      --btn-hover: #9cc78a;
      --text: #333333;
      --white: #ffffff;
      --shadow: rgba(31, 41, 55, 0.08);
    }
    
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    
    .card {
      background: var(--white);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 12px 30px var(--shadow);
    }
    
    h1 {
      font-size: 28px;
      margin: 0 0 12px 0;
    }
    
    p {
      font-size: 15px;
      color: rgba(51, 51, 51, 0.7);
      margin: 0 0 24px 0;
    }
    
    .btn {
      background: var(--btn);
      border: 0;
      color: var(--white);
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
      transition: background 0.12s ease, transform 0.08s ease;
    }
    
    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }
    
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(51, 51, 51, 0.6);
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Volunteer Dashboard</h1>
      <p>Welcome to your volunteer panel. View available opportunities and track your contributions.</p>
      <a href="index.html" class="btn">Back to Home</a>
      <footer>Help Route • Hackathon Prototype</footer>
    </div>
  </div>
</body>
</html>
