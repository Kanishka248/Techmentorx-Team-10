<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HelpRoute — Auth</title>

<style>
:root{
--bg:#E1F0DA;
--accent:#9cc589;
--card-highlight:#35a02d00;
--btn:#427A43;
--btn-hover:#5b944f;
--text:#333333;
--white:#d3e6cdf7;
--shadow:rgba(31,41,55,0.08);
}

*{box-sizing:border-box}
html,body{height:100%}

body{
margin:0;
font-family:Inter,system-ui;
background:var(--bg);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
padding:24px;
cursor:default;
}

button,a,.role{cursor:pointer}
input{cursor:text}

.wrapper{
width:100%;
max-width:600px;   /* increase width */
padding:16px;
}


.card{
background:var(--white);
border-radius:18px;

/* ADD THIS LINE */
border:2px solid rgba(63,125,60,.25);


box-shadow:0 15px 40px rgba(0,0,0,.08);
padding:48px 40px;
text-align:center;
}


/* ===== PREMIUM TITLE ===== */
.fancy-title{
font-size:42px;
font-weight:900;
letter-spacing:1px;
margin:0 0 6px 0;
background:linear-gradient(90deg,#427A43,#7fbf7a);
background-clip:text;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 4px 12px rgba(66,122,67,.35);
position:relative;
display:inline-block;
padding-bottom:6px;
}

.fancy-title::after{
content:"";
position:absolute;
left:10%;
bottom:0;
width:80%;
height:3px;
background:#427A43;
border-radius:4px;
}

.fancy-title:hover{
transform:scale(1.04);
transition:.2s ease;
}
/* ========================= */

.tag{
font-size:13px;
color:#555;
margin-bottom:12px;
}

.switches a{
display:block;
color:#427A43;
font-weight:600;
text-decoration:none;
margin:4px 0;
}

.forms{position:relative;min-height:320px}

form{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
gap:12px;
transition:.3s;
}

.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}

input{
padding:14px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
}

input:focus{
box-shadow:0 0 0 4px rgba(66,122,67,.2);
}

.roles{display:flex;gap:10px;margin-top:8px}

.role{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
background:#fff;
font-weight:600;
}

.role[aria-pressed="true"]{
background:var(--btn);
color:#fff;
border-color:transparent;
}

.btn-primary{
background:var(--btn);
border:0;
padding:14px;
border-radius:10px;
font-weight:700;
color:white;
margin-top:6px;
}

.btn-primary:hover{background:var(--btn-hover)}

footer{
text-align:center;
margin-top:18px;
font-size:12px;
color:#777;
}
</style>
</head>

<body>

<div class="wrapper">
<section class="card">

<h1 class="fancy-title">HelpRoute</h1>

<div class="tag">Connecting donors, volunteers & communities</div>

<div class="switches">
<a id="toSignup" href="#">New user? Sign up</a>
<a id="toLogin" href="#">Already have an account? Login</a>
</div>

<div class="forms">

<form id="loginForm">
<input id="loginEmail" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">

<div class="roles">
<button type="button" class="role" data-role="donor" aria-pressed="true">Donor</button>
<button type="button" class="role" data-role="volunteer">Volunteer</button>
<button type="button" class="role" data-role="admin">Admin</button>
</div>

<button class="btn-primary" id="loginBtn" type="button">Login</button>
</form>

<form id="signupForm" class="hidden">
<input id="signupName" placeholder="Full Name">
<input id="signupEmail" placeholder="Email">
<input id="signupPass" type="password" placeholder="Password">
<input id="signupPass2" type="password" placeholder="Confirm Password">

<div class="roles">
<button type="button" class="role" data-role="donor" aria-pressed="true">Donor</button>
<button type="button" class="role" data-role="volunteer">Volunteer</button>
</div>

<button class="btn-primary" id="signupBtn" type="button">Sign Up</button>
</form>

</div>

<footer>HelpRoute • Built for Hackathon Demo</footer>

</section>
</div>

<script>
const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");

toSignup.onclick=()=>{signupForm.classList.remove("hidden");loginForm.classList.add("hidden")}
toLogin.onclick=()=>{loginForm.classList.remove("hidden");signupForm.classList.add("hidden")}

document.querySelectorAll(".roles").forEach(r=>{
r.querySelectorAll(".role").forEach(b=>{
b.onclick=()=>{
r.querySelectorAll(".role").forEach(x=>x.setAttribute("aria-pressed","false"));
b.setAttribute("aria-pressed","true");
}
})
})

loginBtn.onclick=()=>{
location.href=loginForm.querySelector("[aria-pressed='true']").dataset.role+".html";
}

signupBtn.onclick=()=>{
location.href=signupForm.querySelector("[aria-pressed='true']").dataset.role+".html";
}
</script>

</body>
</html>
