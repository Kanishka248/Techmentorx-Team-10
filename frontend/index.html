<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HelpRoute — Auth</title>

<style>
body{
cursor: default;
}

button,a,.role{
cursor:pointer;
}

input{
cursor:text;
}

:root{
--bg:#E1F0DA;
--accent:#9cc589;
--card-highlight:#d2ee91;
--btn:#427A43;
--btn-hover:#b8e28b;
--text:#333333;
--white:#ddf2c8;
--shadow:rgba(31,41,55,0.08);
}
body{
cursor:url("cursor.png"), auto;
}


*{box-sizing:border-box}
html,body{height:100%}

body{
margin:0;
font-family:Inter,system-ui;
background:var(--bg);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

.wrapper{width:100%;max-width:620px;padding:16px}

.card{
background:var(--white);
border:2px solid var(--card-highlight);
border-radius:16px;
box-shadow:0 12px 30px var(--shadow);
padding:28px;
}

header{text-align:center;margin-bottom:18px}

.brand{
font-size:34px;
font-weight:800;
margin:0;
letter-spacing:.5px;
text-shadow:0 2px 8px rgba(0,0,0,.08);
}

.help{color:#608d5f}
.route{color:#333}

.tag{font-size:13px;color:rgba(51,51,51,.7)}

.switches{
display:flex;
flex-direction:column;
gap:6px;
align-items:center;
margin-top:8px
}

.switches a{color:#548453;text-decoration:none;font-weight:600}

.forms{position:relative;min-height:320px}

form{
position:absolute;inset:0;
display:flex;
flex-direction:column;
gap:12px;
transition:.3s;
}

.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}

input{
padding:12px;
border-radius:10px;
border:1px solid #dfe7d8;
outline:none
}

input:focus{box-shadow:0 0 0 6px rgba(221,246,210,.6)}

.roles{display:flex;gap:10px}

.role{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
background:#fff;
cursor:pointer
}

.role[aria-pressed="true"]{background:var(--btn);color:#fff}

.btn-primary{
background:var(--btn);
border:0;
padding:12px;
border-radius:10px;
font-weight:700;
cursor:pointer
}

.btn-primary:hover{background:var(--btn-hover)}

footer{text-align:center;margin-top:16px;font-size:13px;color:#666}
</style>
</head>

<body>

<div class="wrapper">
<section class="card">

<header>
<h1 class="brand">
<span class="help">Help</span><span class="route">Route</span>
</h1>

<div class="tag">Connecting donors, volunteers & communities</div>

<div class="switches">
<a id="toSignup" href="#">New user? Sign up</a>
<a id="toLogin" href="#">Already have an account? Login</a>
</div>
</header>

<div class="forms">

<form id="loginForm">
<input id="loginEmail" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">

<div class="roles">
<button type="button" class="role" data-role="donor" aria-pressed="true">Donor</button>
<button type="button" class="role" data-role="volunteer">Volunteer</button>
<button type="button" class="role" data-role="admin">Admin</button>
</div>

<button class="btn-primary" id="loginBtn" type="button">Login</button>
</form>

<form id="signupForm" class="hidden">

<input id="signupName" placeholder="Full Name">
<input id="signupEmail" placeholder="Email">
<input id="signupPass" type="password" placeholder="Password">
<input id="signupPass2" type="password" placeholder="Confirm Password">

<div class="roles">
<button type="button" class="role" data-role="donor" aria-pressed="true">Donor</button>
<button type="button" class="role" data-role="volunteer">Volunteer</button>
</div>

<button class="btn-primary" id="signupBtn" type="button">Sign Up</button>
</form>

</div>

<footer>HelpRoute • Built for Hackathon Demo</footer>

</section>
</div>

<script>
const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");

toSignup.onclick=()=>{signupForm.classList.remove("hidden");loginForm.classList.add("hidden")}
toLogin.onclick=()=>{loginForm.classList.remove("hidden");signupForm.classList.add("hidden")}

document.querySelectorAll(".roles").forEach(r=>{
r.querySelectorAll(".role").forEach(b=>{
b.onclick=()=>{r.querySelectorAll(".role").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")}
})
})

loginBtn.onclick=()=>{
const role=loginForm.querySelector("[aria-pressed='true']").dataset.role;
location.href=role+".html";
}

signupBtn.onclick=()=>{
const role=signupForm.querySelector("[aria-pressed='true']").dataset.role;
location.href=role+".html";
}
</script>

</body>
</html>
